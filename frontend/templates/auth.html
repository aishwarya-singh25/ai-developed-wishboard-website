<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Wishlist App</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/auth.css') }}">
</head>
<body>
    <div class="container">
        <h1>Wishlist Sharing App</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div id="auth-forms">
            <!-- Login Form -->
            <div id="login-form">
                <h2>Login</h2>
                <form action="/auth/login" method="post">
                    <input type="text" name="username" placeholder="Username" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p>Don't have an account? <a href="#" onclick="showSignup()">Sign up</a></p>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" style="display: none;">
                <h2>Sign Up</h2>
                <form action="/auth/signup" method="post">
                    <input type="text" name="username" placeholder="Username (3-50 chars)" required minlength="3" maxlength="50">
                    <input type="password" name="password" placeholder="Password (min 8 chars)" required minlength="8">
                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    <script>
        function showSignup() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }
    </script>
</body>
</html>
