<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wishlist App</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Wishlists</h1>
            <nav>
                <a href="/auth/logout">Logout</a>
            </nav>
        </header>

        <div id="create-wishlist">
            <h2>Create New Wishlist</h2>
            <form id="wishlist-form">
                <input type="text" id="wishlist-name" placeholder="Wishlist name" required>
                <button type="submit">Create Wishlist</button>
            </form>
        </div>

        <div id="wishlists">
            <h2>Your Wishlists</h2>
            <div id="wishlist-list">
                <!-- Wishlists will be loaded here -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    <script>
        // Load wishlists on page load
        document.addEventListener('DOMContentLoaded', loadWishlists);

        // Handle wishlist creation
        document.getElementById('wishlist-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('wishlist-name').value.trim();
            if (!name) return;

            try {
                const response = await fetch('/wishlist/wishlists', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (response.ok) {
                    document.getElementById('wishlist-name').value = '';
                    loadWishlists();
                    showMessage('Wishlist created!', 'success');
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Error creating wishlist', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        });

        async function loadWishlists() {
            try {
                const response = await fetch('/dashboard/dashboard');
                if (response.ok) {
                    const wishlists = await response.json();
                    displayWishlists(wishlists);
                } else if (response.status === 401) {
                    window.location.href = '/auth';
                }
            } catch (error) {
                showMessage('Error loading wishlists', 'error');
            }
        }

        function displayWishlists(wishlists) {
            const container = document.getElementById('wishlist-list');
            if (wishlists.length === 0) {
                container.innerHTML = '<p>No wishlists yet. Create your first one above!</p>';
                return;
            }

            container.innerHTML = wishlists.map(wishlist => `
                <div class="wishlist-card">
                    <h3><a href="/wishlist/${wishlist.id}">${wishlist.name}</a></h3>
                    <p>Created: ${new Date(wishlist.created_at).toLocaleDateString()}</p>
                    <button onclick="deleteWishlist(${wishlist.id})">Delete</button>
                </div>
            `).join('');
        }

        async function deleteWishlist(id) {
            if (!confirm('Are you sure you want to delete this wishlist?')) return;

            try {
                const response = await fetch(`/wishlist/wishlists/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadWishlists();
                    showMessage('Wishlist deleted!', 'success');
                } else {
                    showMessage('Error deleting wishlist', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        }
    </script>
</body>
</html>
