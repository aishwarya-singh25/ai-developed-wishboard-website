<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Wishlist App</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="wishlist-title">Loading...</h1>
            <nav>
                <a href="/dashboard">Back to Dashboard</a> |
                <a href="/auth/logout">Logout</a>
            </nav>
        </header>

        <div id="add-item">
            <h2>Add New Item</h2>
            <form id="item-form">
                <input type="text" id="item-name" placeholder="Item name" required>
                <textarea id="item-note" placeholder="Optional note"></textarea>
                <input type="url" id="item-url" placeholder="Optional URL">
                <button type="submit">Add Item</button>
            </form>
        </div>

        <div id="items">
            <h2>Items</h2>
            <div id="item-list">
                <!-- Items will be loaded here -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    <script>
        const wishlistId = window.location.pathname.split('/').pop();

        // Load wishlist and items on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadWishlist();
            loadItems();
        });

        // Handle item creation
        document.getElementById('item-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value.trim();
            const note = document.getElementById('item-note').value.trim();
            const url = document.getElementById('item-url').value.trim();

            if (!name) return;

            try {
                const response = await fetch(`/wishlist/wishlists/${wishlistId}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        note: note || null,
                        url: url || null
                    })
                });

                if (response.ok) {
                    document.getElementById('item-name').value = '';
                    document.getElementById('item-note').value = '';
                    document.getElementById('item-url').value = '';
                    loadItems();
                    showMessage('Item added!', 'success');
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Error adding item', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        });

        async function loadWishlist() {
            try {
                const response = await fetch(`/wishlist/wishlists/${wishlistId}`);
                if (response.ok) {
                    const wishlist = await response.json();
                    document.getElementById('wishlist-title').textContent = wishlist.name;
                } else if (response.status === 401) {
                    window.location.href = '/auth';
                } else {
                    showMessage('Wishlist not found', 'error');
                }
            } catch (error) {
                showMessage('Error loading wishlist', 'error');
            }
        }

        async function loadItems() {
            try {
                const response = await fetch(`/wishlist/wishlists/${wishlistId}/items`);
                if (response.ok) {
                    const items = await response.json();
                    displayItems(items);
                }
            } catch (error) {
                showMessage('Error loading items', 'error');
            }
        }

        function displayItems(items) {
            const container = document.getElementById('item-list');
            if (items.length === 0) {
                container.innerHTML = '<p>No items yet. Add your first item above!</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="item-card">
                    <h3>${item.name}</h3>
                    ${item.note ? `<p>Note: ${item.note}</p>` : ''}
                    ${item.url ? `<p>URL: <a href="${item.url}" target="_blank">${item.url}</a></p>` : ''}
                    <p>Added: ${new Date(item.created_at).toLocaleDateString()}</p>
                    <button onclick="editItem(${item.id})">Edit</button>
                    <button onclick="deleteItem(${item.id})">Delete</button>
                </div>
            `).join('');
        }

        async function deleteItem(itemId) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            try {
                const response = await fetch(`/wishlist/wishlists/${wishlistId}/items/${itemId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadItems();
                    showMessage('Item deleted!', 'success');
                } else {
                    showMessage('Error deleting item', 'error');
                }
            } catch (error) {
                showMessage('Network error', 'error');
            }
        }

        function editItem(itemId) {
            // TODO: Implement edit functionality
            showMessage('Edit functionality coming soon!', 'info');
        }
    </script>
</body>
</html>
